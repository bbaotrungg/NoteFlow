name: NoteFlow AI - CI & Release APK Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: Analyze, Unit Test (>70% Coverage) & Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter 3.22+ (Dart 3)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit Tests (SuperMemo SM-2 & Spatial OCR Clustering)
        run: flutter test --coverage

      - name: Build Production APK
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building Production APK..."
            if flutter build apk --release \
              --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}; then
              echo "Build succeeded on attempt $i"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Build failed on attempt $i. Retrying in 15 seconds..."
              sleep 15
            else
              echo "Build failed after 3 attempts."
              exit 1
            fi
          done
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/NoteFlow-AI-v1.0.0.apk || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-AI-v1.0.0-apk
          path: build/app/outputs/flutter-apk/NoteFlow-AI-v1.0.0.apk
