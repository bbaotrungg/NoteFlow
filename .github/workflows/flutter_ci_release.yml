name: NoteFlow AI - CI & Release APK Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: Analyze, Unit Test (>70% Coverage) & Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.22+ (Dart 3)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit Tests (SuperMemo SM-2 & Spatial OCR Clustering)
        run: flutter test --coverage

      - name: Build Production APK
        run: |
          flutter build apk --release             --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}             --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}             --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noteflow-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
